<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Sharebuff logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf6a3a"/>
      <stop offset="1" stop-color="#9c431f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f4eee2"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- clipboard board -->
  <rect x="32" y="28" width="64" height="78" rx="12" fill="url(#paper)"/>
  <!-- clip -->
  <rect x="50" y="19" width="28" height="16" rx="6" fill="#7d3517"/>
  <rect x="54" y="23" width="20" height="8" rx="4" fill="#f4eee2"/>

  <!-- keyhole -->
  <circle cx="64" cy="60" r="11" fill="#b4552d"/>
  <path d="M60 66 L68 66 L72 88 Q72 91 69 91 L59 91 Q56 91 56 88 Z" fill="#b4552d"/>

  <!-- one-shot dissolve: the right edge burns away -->
  <g fill="#f4eee2">
    <rect x="99"  y="44" width="5" height="5" rx="1.5" opacity="0.85"/>
    <rect x="106" y="56" width="4" height="4" rx="1.5" opacity="0.55"/>
    <rect x="101" y="70" width="4" height="4" rx="1.5" opacity="0.6"/>
    <rect x="109" y="82" width="3" height="3" rx="1"   opacity="0.35"/>
    <rect x="103" y="93" width="3" height="3" rx="1"   opacity="0.3"/>
  </g>
  <g fill="#7d3517">
    <rect x="90" y="34" width="5" height="5" rx="1.5" opacity="0.35"/>
    <rect x="93" y="100" width="4" height="4" rx="1.5" opacity="0.3"/>
  </g>
</svg>
